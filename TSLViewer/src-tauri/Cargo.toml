[package]
name = "tslviewer"
version = "0.1.0"
description = "TMC6460 motion control workbench"
authors = ["TSL"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tslviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
parking_lot = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
